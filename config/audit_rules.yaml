version: "1.0"
audit_scenarios:
  # ==================== 作业指导书审核规则 ====================
  - scenario_id: "work_instruction_audit"
    name: "作业指导书审核"
    total_points: 100
    
    dimensions:
      # 维度1: 结构完整性
      - dimension_id: "structure_integrity"
        name: "结构完整性"
        weight: 0.20
        
        items:
          - item_id: "toc_coverage"
            name: "目录覆盖全面性"
            checkpoints:
              - checkpoint_id: "toc_01"
                description: "是否包含岗位条件说明章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "toc_02"
                description: "是否包含职责说明章节"
                severity: "high"
                max_deduction: 3
              
              - checkpoint_id: "toc_03"
                description: "是否包含作业流程章节"
                severity: "critical"
                max_deduction: 5
          
          - item_id: "chapter_numbering"
            name: "章节编号规范性"
            checkpoints:
              - checkpoint_id: "num_01"
                description: "章节编号是否连续且符合规范（如 1, 1.1, 1.1.1）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "num_02"
                description: "各级标题是否正确使用编号"
                severity: "low"
                max_deduction: 2
      
      # 维度2: 内容完整性
      - dimension_id: "content_completeness"
        name: "内容完整性"
        weight: 0.40
        
        items:
          - item_id: "safety_notes"
            name: "安全注意事项"
            checkpoints:
              - checkpoint_id: "safety_01"
                description: "每个作业步骤是否包含安全注意事项"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "safety_02"
                description: "是否明确标注危险源和风险点"
                severity: "critical"
                max_deduction: 8
              
              - checkpoint_id: "safety_03"
                description: "是否提供个人防护装备要求"
                severity: "high"
                max_deduction: 5
          
          - item_id: "operation_steps"
            name: "操作步骤完整性"
            checkpoints:
              - checkpoint_id: "step_01"
                description: "作业步骤是否清晰、完整、可执行"
                severity: "high"
                max_deduction: 7
              
              - checkpoint_id: "step_02"
                description: "是否包含准备工作、实施步骤、收尾工作"
                severity: "medium"
                max_deduction: 5
              
              - checkpoint_id: "step_03"
                description: "关键步骤是否有详细说明或配图"
                severity: "medium"
                max_deduction: 4
      
      # 维度3: 格式规范性
      - dimension_id: "format_compliance"
        name: "格式规范性"
        weight: 0.15
        
        items:
          - item_id: "text_format"
            name: "文本格式"
            checkpoints:
              - checkpoint_id: "fmt_01"
                description: "标题字体是否符合规范（如一级标题黑体、二级标题宋体加粗）"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "fmt_02"
                description: "正文字体和字号是否统一"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "fmt_03"
                description: "行间距和段间距是否符合规范"
                severity: "low"
                max_deduction: 1
          
          - item_id: "title_hierarchy"
            name: "标题层级"
            checkpoints:
              - checkpoint_id: "title_01"
                description: "标题层级是否清晰且不超过4级"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "title_02"
                description: "同级标题格式是否一致"
                severity: "low"
                max_deduction: 2
      
      # 维度4: 图表质量
      - dimension_id: "visual_quality"
        name: "图表质量"
        weight: 0.15
        
        items:
          - item_id: "image_clarity"
            name: "图片清晰度"
            checkpoints:
              - checkpoint_id: "img_01"
                description: "所有图片是否清晰可辨"
                severity: "medium"
                max_deduction: 4
              
              - checkpoint_id: "img_02"
                description: "图片是否有编号和标题"
                severity: "low"
                max_deduction: 2
          
          - item_id: "table_completeness"
            name: "表格完整性"
            checkpoints:
              - checkpoint_id: "tbl_01"
                description: "表格是否有标题和编号"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "tbl_02"
                description: "表格内容是否完整无遗漏"
                severity: "medium"
                max_deduction: 4
              
              - checkpoint_id: "tbl_03"
                description: "表格格式是否规范（边框、对齐）"
                severity: "low"
                max_deduction: 2
      
      # 维度5: 附件完整性
      - dimension_id: "appendix_completeness"
        name: "附件完整性"
        weight: 0.10
        
        items:
          - item_id: "appendix_coverage"
            name: "附录和参考文献"
            checkpoints:
              - checkpoint_id: "app_01"
                description: "是否包含相关法规和标准清单"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "app_02"
                description: "是否包含必要的附录（如表单模板、检查清单）"
                severity: "medium"
                max_deduction: 4
              
              - checkpoint_id: "app_03"
                description: "参考文献引用是否规范"
                severity: "low"
                max_deduction: 3
      
      # 维度6: 文字及语法规范
      - dimension_id: "grammar_correctness"
        name: "文字及语法规范"
        weight: 0.10
        
        items:
          - item_id: "punctuation"
            name: "标点符号"
            checkpoints:
              - checkpoint_id: "punctuation_01"
                description: "标点符号是否重复（如逗号、句号）"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "punctuation_02"
                description: "括号、引号是否匹配"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "punctuation_03"
                description: "句号、问号、感叹号使用是否正确"
                severity: "low"
                max_deduction: 1
          
          - item_id: "sentence_fluency"
            name: "语句通顺"
            checkpoints:
              - checkpoint_id: "sentence_01"
                description: "是否存在病句（句子不完整、成分残缺）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "sentence_02"
                description: "是否存在歧义句（表达不清、容易误解）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "sentence_03"
                description: "语句逻辑是否清晰（无重复赘述、表达准确）"
                severity: "low"
                max_deduction: 2
          
          - item_id: "terminology"
            name: "专业术语"
            checkpoints:
              - checkpoint_id: "term_01"
                description: "专业术语拼写是否正确"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "term_02"
                description: "术语使用是否统一（全文一致）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "term_03"
                description: "术语使用是否规范（符合行业标准）"
                severity: "low"
                max_deduction: 2
      
      # 维度7: 业务逻辑连贯性
      - dimension_id: "logic_coherence"
        name: "业务逻辑连贯性"
        weight: 0.10
        
        items:
          - item_id: "context_coherence"
            name: "上下文连贯"
            checkpoints:
              - checkpoint_id: "logic_01"
                description: "章节顺序是否连贯（无跳跃、缺失）"
                severity: "high"
                max_deduction: 7
              
              - checkpoint_id: "logic_02"
                description: "内容前后是否矛盾"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "logic_03"
                description: "引用和被引用内容是否一致"
                severity: "medium"
                max_deduction: 4
          
          - item_id: "time_logic"
            name: "时间逻辑"
            checkpoints:
              - checkpoint_id: "time_01"
                description: "时间顺序是否合理（汛前-汛期-汛后）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "time_02"
                description: "时间节点内容是否匹配（内容与所在章节时间一致）"
                severity: "medium"
                max_deduction: 4
          
          - item_id: "emergency_process"
            name: "应急处置流程"
            checkpoints:
              - checkpoint_id: "emergency_01"
                description: "应急步骤顺序是否合理（先安全后恢复）"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "emergency_02"
                description: "应急流程是否完整（发现-上报-评估-处置-恢复-总结）"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "emergency_03"
                description: "关键步骤是否缺失（如停输、隔离、通知等）"
                severity: "high"
                max_deduction: 8

  # ==================== 风险管控方案审核规则 ====================
  - scenario_id: "risk_management_audit"
    name: "风险管控方案审核"
    total_points: 100
    
    dimensions:
      # 维度1: 风险识别完整性
      - dimension_id: "risk_identification"
        name: "风险识别完整性"
        weight: 0.30
        
        items:
          - item_id: "hazard_identification"
            name: "危险源识别"
            checkpoints:
              - checkpoint_id: "haz_01"
                description: "是否系统识别所有主要危险源"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "haz_02"
                description: "危险源分类是否科学合理（物理、化学、生物、人因等）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "haz_03"
                description: "是否采用科学方法进行风险评估（如LEC法、作业条件危险性评价）"
                severity: "high"
                max_deduction: 6
          
          - item_id: "risk_level"
            name: "风险等级评定"
            checkpoints:
              - checkpoint_id: "risk_01"
                description: "是否对每个危险源进行风险等级评定"
                severity: "critical"
                max_deduction: 8
              
              - checkpoint_id: "risk_02"
                description: "风险等级划分标准是否明确"
                severity: "medium"
                max_deduction: 4
      
      # 维度2: 管控措施有效性
      - dimension_id: "control_effectiveness"
        name: "管控措施有效性"
        weight: 0.35
        
        items:
          - item_id: "technical_measures"
            name: "技术措施"
            checkpoints:
              - checkpoint_id: "tech_01"
                description: "是否针对每个风险点制定技术管控措施"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "tech_02"
                description: "技术措施是否符合本质安全原则（消除、替代、工程控制）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "tech_03"
                description: "是否明确安全设施和防护装置要求"
                severity: "high"
                max_deduction: 5
          
          - item_id: "management_measures"
            name: "管理措施"
            checkpoints:
              - checkpoint_id: "mgmt_01"
                description: "是否制定管理制度和操作规程"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "mgmt_02"
                description: "是否明确培训教育要求"
                severity: "medium"
                max_deduction: 4
              
              - checkpoint_id: "mgmt_03"
                description: "是否建立监督检查机制"
                severity: "medium"
                max_deduction: 4
      
      # 维度3: 应急预案完备性
      - dimension_id: "emergency_preparedness"
        name: "应急预案完备性"
        weight: 0.20
        
        items:
          - item_id: "emergency_process"
            name: "应急流程"
            checkpoints:
              - checkpoint_id: "emer_01"
                description: "是否制定针对性的应急预案"
                severity: "critical"
                max_deduction: 8
              
              - checkpoint_id: "emer_02"
                description: "应急响应流程是否清晰可执行"
                severity: "high"
                max_deduction: 5
              
              - checkpoint_id: "emer_03"
                description: "是否明确应急处置措施和步骤"
                severity: "high"
                max_deduction: 5
          
          - item_id: "emergency_contacts"
            name: "应急联系方式"
            checkpoints:
              - checkpoint_id: "contact_01"
                description: "是否提供完整的应急联系人和联系方式"
                severity: "medium"
                max_deduction: 4
              
              - checkpoint_id: "contact_02"
                description: "是否包含外部救援机构联系方式（消防、医疗、环保等）"
                severity: "medium"
                max_deduction: 3
      
      # 维度4: 责任分工明确性
      - dimension_id: "responsibility_clarity"
        name: "责任分工明确性"
        weight: 0.10
        
        items:
          - item_id: "job_responsibility"
            name: "岗位职责"
            checkpoints:
              - checkpoint_id: "resp_01"
                description: "是否明确各岗位安全职责"
                severity: "high"
                max_deduction: 5
              
              - checkpoint_id: "resp_02"
                description: "责任人和责任范围是否清晰"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "resp_03"
                description: "是否建立问责机制"
                severity: "low"
                max_deduction: 2
      
      # 维度5: 检查与更新机制
      - dimension_id: "review_update"
        name: "检查与更新机制"
        weight: 0.05
        
        items:
          - item_id: "periodic_review"
            name: "定期检查要求"
            checkpoints:
              - checkpoint_id: "review_01"
                description: "是否明确定期检查和评估要求"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "review_02"
                description: "是否规定方案更新和修订条件"
                severity: "low"
                max_deduction: 2
      
      # 维度6: 图片标注完整性
      - dimension_id: "image_annotation"
        name: "图片标注完整性"
        weight: 0.15
        
        items:
          - item_id: "impact_map"
            name: "影像图（高后果区示意图）"
            checkpoints:
              - checkpoint_id: "image_annot_01"
                description: "是否清晰标注管道位置（实线）"
                severity: "critical"
                max_deduction: 8
              
              - checkpoint_id: "image_annot_02"
                description: "是否标注潜在影响半径（虚线，管道左右两侧）"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "image_annot_03"
                description: "建筑物标注是否完整（名称、人员数量、属性）"
                severity: "high"
                max_deduction: 6
          
          - item_id: "route_map"
            name: "入场路线图"
            checkpoints:
              - checkpoint_id: "route_01"
                description: "入场路线是否合理（不穿山、不穿墙、不跨河无桥）"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "route_02"
                description: "路线是否在可行车道路上"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "route_03"
                description: "道路标注是否清晰（道路名称、宽度等）"
                severity: "medium"
                max_deduction: 4
          
          - item_id: "evacuation_map"
            name: "逃生路线图"
            checkpoints:
              - checkpoint_id: "evac_01"
                description: "疏散方向是否正确（应向管道两侧，不能顺管道方向）"
                severity: "critical"
                max_deduction: 10
              
              - checkpoint_id: "evac_02"
                description: "集结点是否在潜在影响半径外"
                severity: "critical"
                max_deduction: 8
              
              - checkpoint_id: "evac_03"
                description: "疏散路线是否标注清晰（箭头、距离、时间）"
                severity: "high"
                max_deduction: 5
      
      # 维度7: 图文一致性
      - dimension_id: "text_image_consistency"
        name: "图文一致性"
        weight: 0.10
        
        items:
          - item_id: "building_info"
            name: "建筑物信息一致性"
            checkpoints:
              - checkpoint_id: "consistency_01"
                description: "建筑物描述（层数、人数）是否与影像图标注一致"
                severity: "high"
                max_deduction: 8
              
              - checkpoint_id: "consistency_02"
                description: "建筑物名称、类型是否与影像图一致"
                severity: "medium"
                max_deduction: 5
          
          - item_id: "data_consistency"
            name: "表格数据一致性"
            checkpoints:
              - checkpoint_id: "data_01"
                description: "区段长、桩号等基础数据在各表中是否一致"
                severity: "high"
                max_deduction: 7
              
              - checkpoint_id: "data_02"
                description: "人员数量在不同章节、表格中是否一致"
                severity: "medium"
                max_deduction: 5
              
              - checkpoint_id: "data_03"
                description: "位置信息（地址、坐标）是否前后一致"
                severity: "medium"
                max_deduction: 4
      
      # 维度8: 数据合规性
      - dimension_id: "data_compliance"
        name: "数据合规性"
        weight: 0.05
        
        items:
          - item_id: "range_check"
            name: "数据范围检查"
            checkpoints:
              - checkpoint_id: "range_01"
                description: "电位测试结果是否在规范范围内（-0.85V ~ -1.2V）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "range_02"
                description: "风险等级是否使用规范术语（低、中、较高、高）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "range_03"
                description: "数值单位是否统一规范"
                severity: "low"
                max_deduction: 2

