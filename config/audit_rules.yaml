version: "2.0"
source: "生产运维管理领域AI 算法应用竞赛规则-2025.7.11"
generated_at: "2025-01-22"

audit_scenarios:
  # ==================== 场景一：作业指导书审核 ====================
  - scenario_id: "work_instruction_audit"
    name: "作业指导书AI审核"
    total_points: 100
    
    dimensions:
      # 维度1: 整体审核 - 内容与结构完整性 (50分)
      - dimension_id: "structure_completeness"
        name: "内容与结构完整性"
        weight: 0.50
        
        items:
          - item_id: "mandatory_sections"
            name: "必备九部分覆盖"
            checkpoints:
              - checkpoint_id: "sec_overview"
                description: "是否包含作业区（站队）概况章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_qhse"
                description: "是否包含QHSE目标指标章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_positions"
                description: "是否包含岗位设置与职责章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_workflow"
                description: "是否包含重点业务流程及内容章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_operation"
                description: "是否包含操作指南章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_emergency"
                description: "是否包含应急处置章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_risk"
                description: "是否包含风险辨识与控制章节"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "sec_assessment"
                description: "是否包含考核章节"
                severity: "high"
                max_deduction: 3
              
              - checkpoint_id: "sec_appendix"
                description: "是否包含附录章节"
                severity: "high"
                max_deduction: 3
          
          - item_id: "toc_coverage"
            name: "目录全面性"
            checkpoints:
              - checkpoint_id: "toc_position"
                description: "目录是否涵盖岗位条件模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_responsibility"
                description: "目录是否涵盖职责模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_guide"
                description: "目录是否涵盖作业指引模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_inspection"
                description: "目录是否涵盖巡检模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_operation"
                description: "目录是否涵盖操作规范模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_emergency"
                description: "目录是否涵盖应急模块"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "toc_training"
                description: "目录是否涵盖培训模块"
                severity: "medium"
                max_deduction: 1
          
          - item_id: "structure_logic"
            name: "结构逻辑规范"
            checkpoints:
              - checkpoint_id: "hierarchy_clear"
                description: "层级逻辑是否清晰（标题层次分明）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "numbering_standard"
                description: "章节编号是否符合标准（如1.1.1分级，连续无跳跃）"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "title_concise"
                description: "标题是否简洁明确"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "appendix_complete"
                description: "附录配套是否完整"
                severity: "low"
                max_deduction: 2
              
              - checkpoint_id: "page_index_accurate"
                description: "页码与索引是否准确，目录页码与实际内容是否一致"
                severity: "medium"
                max_deduction: 3
      
      # 维度2: 细节审核 (35分)
      - dimension_id: "detail_audit"
        name: "细节审核"
        weight: 0.35
        
        items:
          - item_id: "grammar_errors"
            name: "文字及语法错误"
            checkpoints:
              - checkpoint_id: "sentence_fluency"
                description: "全文语句是否通顺（无病句、残句、歧义句）"
                severity: "medium"
                max_deduction: 5
              
              - checkpoint_id: "punctuation_correct"
                description: "标点符号是否使用正确（逗号、句号、括号、引号匹配）"
                severity: "low"
                max_deduction: 3
              
              - checkpoint_id: "terminology_accurate"
                description: "专业术语名词或缩写是否准确（拼写正确、术语统一）"
                severity: "medium"
                max_deduction: 4
          
          - item_id: "logic_errors"
            name: "业务逻辑错误"
            checkpoints:
              - checkpoint_id: "context_coherent"
                description: "上下文逻辑是否连贯（无跳跃、顺序合理）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "semantic_consistent"
                description: "上下文语义是否矛盾（前后表述一致）"
                severity: "high"
                max_deduction: 6
              
              - checkpoint_id: "time_logic"
                description: "时间是否与文字表述相对应（时间顺序合理）"
                severity: "medium"
                max_deduction: 4
          
          - item_id: "emergency_audit"
            name: "应急处置专项审核"
            checkpoints:
              - checkpoint_id: "emergency_content_reasonable"
                description: "生产异常事件处置内容是否合理（措施科学、可行）"
                severity: "critical"
                max_deduction: 7
              
              - checkpoint_id: "emergency_sequence_correct"
                description: "处置顺序是否正确（先安全后恢复、先停输再处理等）"
                severity: "critical"
                max_deduction: 7
              
              - checkpoint_id: "emergency_steps_complete"
                description: "处置流程是否缺失关键步骤（发现-上报-评估-启动-处置-恢复-总结）"
                severity: "critical"
                max_deduction: 8
      
      # 维度3: 识别效率 (5分)
      - dimension_id: "recognition_efficiency"
        name: "识别效率"
        weight: 0.05
        
        items:
          - item_id: "processing_time"
            name: "单文档审核耗时"
            checkpoints:
              - checkpoint_id: "time_exceed"
                description: "审核时长：≤60秒(0分扣)，60-120秒(扣1分)，120-180秒(扣2分)，180-240秒(扣3分)，>240秒(扣5分)"
                severity: "medium"
                max_deduction: 5
      
      # 维度4: 兼容性 (5分)
      - dimension_id: "compatibility"
        name: "兼容性"
        weight: 0.05
        
        items:
          - item_id: "format_support"
            name: "格式兼容性"
            checkpoints:
              - checkpoint_id: "word_support"
                description: "是否兼容WORD格式（.doc/.docx）"
                severity: "critical"
                max_deduction: 3
              
              - checkpoint_id: "pdf_support"
                description: "是否兼容PDF格式"
                severity: "critical"
                max_deduction: 2
      
      # 维度5: 模板检测 (5分)
      - dimension_id: "template_detection"
        name: "模板检测"
        weight: 0.05
        
        items:
          - item_id: "template_compliance"
            name: "模板使用检测"
            checkpoints:
              - checkpoint_id: "template_used"
                description: "是否使用规定模板（结构、格式、必备要素）"
                severity: "high"
                max_deduction: 5

  # ==================== 场景二：高后果区风险管控方案审核 ====================
  - scenario_id: "risk_management_audit"
    name: "高后果区风险管控方案AI审核"
    total_points: 100
    
    dimensions:
      # 维度1: 图片识别能力 (45分)
      - dimension_id: "image_recognition"
        name: "图片识别能力"
        weight: 0.45
        
        items:
          - item_id: "signature_recognition"
            name: "签字页手签识别"
            checkpoints:
              - checkpoint_id: "handwritten_date"
                description: "是否识别签字页手写日期"
                severity: "high"
                max_deduction: 3
              
              - checkpoint_id: "handwritten_signature"
                description: "是否识别签字页手签痕迹"
                severity: "high"
                max_deduction: 3
          
          - item_id: "content_completeness_images"
            name: "图片内容完整性"
            checkpoints:
              - checkpoint_id: "img_impact_map"
                description: "人员密集型是否放置高后果区影像图"
                severity: "critical"
                max_deduction: 3
              
              - checkpoint_id: "img_scene_photo"
                description: "是否放置高后果区现场图"
                severity: "high"
                max_deduction: 2
              
              - checkpoint_id: "img_access_route"
                description: "是否放置入场线路图"
                severity: "critical"
                max_deduction: 3
              
              - checkpoint_id: "img_evacuation_route"
                description: "是否放置逃生路线图及应急疏散集合点位置"
                severity: "critical"
                max_deduction: 3
              
              - checkpoint_id: "img_env_sensitive"
                description: "环境敏感型是否放置水体敏感型高后果区围油设施放置图"
                severity: "high"
                max_deduction: 2
          
          - item_id: "impact_map_annotation"
            name: "影像图标注识别"
            checkpoints:
              - checkpoint_id: "pipeline_line"
                description: "影像图管道位置（实线）是否清晰标注"
                severity: "critical"
                max_deduction: 4
              
              - checkpoint_id: "impact_radius"
                description: "潜在影响半径（虚线）线条是否标注，是否包含三条平行线（管道中心线、左右影响范围）"
                severity: "critical"
                max_deduction: 5
              
              - checkpoint_id: "building_info"
                description: "管道周边建筑物和环境受体的名称和相关信息是否完整（人员数量、建筑物名称等）"
                severity: "high"
                max_deduction: 4
          
          - item_id: "access_route_annotation"
            name: "入场线路图标注识别"
            checkpoints:
              - checkpoint_id: "route_annotation"
                description: "入场路线标注及文字说明是否清晰"
                severity: "high"
                max_deduction: 3
              
              - checkpoint_id: "route_reasonable"
                description: "入场路线是否合理（不能穿山、穿墙、无桥跨河、穿建筑物、不在可行车道路）"
                severity: "critical"
                max_deduction: 6
          
          - item_id: "evacuation_route_annotation"
            name: "逃生路线图、应急疏散集结点标注识别（人员密集型）"
            checkpoints:
              - checkpoint_id: "evacuation_annotation"
                description: "逃生路线、应急疏散集结点位置标注及文字说明是否清晰"
                severity: "high"
                max_deduction: 3
              
              - checkpoint_id: "evacuation_reasonable"
                description: "路线和位置是否合理（疏散方向标注应向管道两侧，集结点位置应在潜在影响半径范围以外）"
                severity: "critical"
                max_deduction: 6
      
      # 维度2: 上下文逻辑识别能力 (40分)
      - dimension_id: "context_logic"
        name: "上下文逻辑识别能力"
        weight: 0.40
        
        items:
          - item_id: "image_text_consistency"
            name: "图片标注一致性"
            checkpoints:
              - checkpoint_id: "building_description_match"
                description: "高后果区特征描述部分对建筑物描述与影像图标注是否一致"
                severity: "high"
                max_deduction: 6
          
          - item_id: "text_consistency"
            name: "上下文内容一致性"
            checkpoints:
              - checkpoint_id: "section_length_match"
                description: "人防措施中涉及的区段长信息与高后果区基本信息表是否一致"
                severity: "high"
                max_deduction: 4
              
              - checkpoint_id: "location_match"
                description: "位置信息与高后果区风险评价结果表是否一致"
                severity: "high"
                max_deduction: 4
              
              - checkpoint_id: "code_consistent"
                description: "高后果区编号前后是否一致"
                severity: "medium"
                max_deduction: 3
          
          - item_id: "standard_compliance"
            name: "标准遵从度"
            checkpoints:
              - checkpoint_id: "gb32167_compliance"
                description: "是否参照GB32167（高后果区识别标准）相关规定"
                severity: "high"
                max_deduction: 5
          
          - item_id: "content_completeness_text"
            name: "文本内容完整性"
            checkpoints:
              - checkpoint_id: "municipal_network_map"
                description: "文中若存在人员密集型高后果区附表则应包含市政管网交叉位置图"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "oil_containment_map"
                description: "文中若存在输油管道环境敏感类高后果区描述则应包含水体敏感型高后果区围油设施放置图"
                severity: "medium"
                max_deduction: 3
          
          - item_id: "time_logic"
            name: "时间逻辑一致性"
            checkpoints:
              - checkpoint_id: "time_consistent"
                description: "封面编制时间、高后果区识别时间、风险评价时间年份应一致"
                severity: "medium"
                max_deduction: 3
              
              - checkpoint_id: "time_sequence"
                description: "时间逻辑为'风险评价时间晚于识别时间'"
                severity: "medium"
                max_deduction: 3
          
          - item_id: "data_logic"
            name: "数据逻辑正确性"
            checkpoints:
              - checkpoint_id: "potential_range"
                description: "电位测试结果部分是否超出-0.85V~-1.2V范围"
                severity: "high"
                max_deduction: 4
              
              - checkpoint_id: "risk_data_format"
                description: "风险评价结果中可能性、后果值、风险值数据为数值，风险等级为'低、中、较高、高'"
                severity: "high"
                max_deduction: 4
          
          - item_id: "template_text_consistency"
            name: "文字模板一致性"
            checkpoints:
              - checkpoint_id: "template_match"
                description: "管道本体管控措施、外部环境风险管控、事故状态下前期处置部分描述是否与模板要求一致或包含"
                severity: "medium"
                max_deduction: 4
      
      # 维度3: 识别效率 (5分)
      - dimension_id: "recognition_efficiency"
        name: "识别效率"
        weight: 0.05
        
        items:
          - item_id: "processing_time"
            name: "单文档审核耗时"
            checkpoints:
              - checkpoint_id: "time_exceed"
                description: "审核时长：≤60秒(0分扣)，60-120秒(扣1分)，120-180秒(扣2分)，180-240秒(扣3分)，>240秒(扣5分)"
                severity: "medium"
                max_deduction: 5
      
      # 维度4: 兼容性 (5分)
      - dimension_id: "compatibility"
        name: "兼容性"
        weight: 0.05
        
        items:
          - item_id: "format_support"
            name: "格式兼容性"
            checkpoints:
              - checkpoint_id: "word_support"
                description: "是否兼容WORD格式（.doc/.docx）"
                severity: "critical"
                max_deduction: 3
              
              - checkpoint_id: "pdf_support"
                description: "是否兼容PDF格式"
                severity: "critical"
                max_deduction: 2
      
      # 维度5: 模板检测 (5分)
      - dimension_id: "template_detection"
        name: "模板检测"
        weight: 0.05
        
        items:
          - item_id: "template_compliance"
            name: "模板使用检测"
            checkpoints:
              - checkpoint_id: "template_used"
                description: "是否使用规定模板（结构、格式、必备要素）"
                severity: "high"
                max_deduction: 5
